---
- name: Collect Linux user account compliance
  hosts: linux
  become: true
  gather_facts: true

  vars:
    report_dir: /tmp/linux-user-compliance

    # false = root + normal human users only
    # true  = include system/service accounts
    include_system_accounts: false

  tasks:

    - name: Create compliance report directory
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install temporary Linux compliance collector
      ansible.builtin.copy:
        dest: /tmp/linux_user_compliance.py
        owner: root
        group: root
        mode: "0700"
        content: |
          #!/usr/bin/python3

          import csv
          import datetime
          import grp
          import os
          import pwd
          import socket
          import subprocess

          INCLUDE_SYSTEM = {{ include_system_accounts | bool | ternary('True', 'False') }}

          REPORT_DIR = "{{ report_dir }}"
          INVENTORY_HOST = "{{ inventory_hostname }}"
          SERVER_IP = "{{ ansible_host | default(ansible_default_ipv4.address | default(inventory_hostname)) }}"

          def run(command):
              try:
                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=20
                  )

                  return result.returncode, result.stdout.strip()

              except Exception as exc:
                  return 1, str(exc)


          def get_uid_min():

              uid_min = 1000

              try:
                  with open("/etc/login.defs", "r") as file:

                      for line in file:

                          line = line.strip()

                          if line.startswith("UID_MIN"):

                              parts = line.split()

                              if len(parts) >= 2:
                                  uid_min = int(parts[1])
                                  break

              except Exception:
                  pass

              return uid_min


          def load_shadow():

              shadow = {}

              try:
                  with open("/etc/shadow", "r") as file:

                      for line in file:

                          fields = line.rstrip("\n").split(":")

                          if len(fields) >= 9:
                              shadow[fields[0]] = fields

              except Exception:
                  pass

              return shadow


          def shadow_day_to_date(value):

              try:

                  days = int(value)

                  if days <= 0:
                      return "Never"

                  result = (
                      datetime.date(1970, 1, 1)
                      + datetime.timedelta(days=days)
                  )

                  return result.isoformat()

              except Exception:
                  return "Unknown"


          def get_groups(username, primary_gid):

              groups = []

              try:

                  primary_group = grp.getgrgid(primary_gid).gr_name

                  groups.append(primary_group)

              except Exception:
                  pass

              for group in grp.getgrall():

                  if username in group.gr_mem:

                      if group.gr_name not in groups:
                          groups.append(group.gr_name)

              return ";".join(groups)


          def get_creation_date(home_directory):

              if not home_directory:
                  return "Unavailable"

              if not os.path.exists(home_directory):
                  return "Unavailable"

              rc, output = run(
                  [
                      "stat",
                      "-c",
                      "%w",
                      home_directory
                  ]
              )

              if rc != 0:
                  return "Unavailable"

              if not output:
                  return "Unavailable"

              if output == "-":
                  return "Unavailable"

              return output


          def get_sudo(username):

              sudo_binary = "/usr/bin/sudo"

              if not os.path.exists(sudo_binary):

                  return (
                      "UNAVAILABLE",
                      "sudo command is not installed"
                  )

              rc, output = run(
                  [
                      sudo_binary,
                      "-n",
                      "-l",
                      "-U",
                      username
                  ]
              )

              output_lower = output.lower()

              denied_strings = [
                  "not allowed to run sudo",
                  "may not run sudo",
                  "is not in the sudoers file"
              ]

              denied = any(
                  item in output_lower
                  for item in denied_strings
              )

              if rc == 0 and not denied:
                  sudo_access = "YES"
              else:
                  sudo_access = "NO"

              if not output:
                  output = "No sudo privileges detected"

              output = " | ".join(
                  output.splitlines()
              )

              return sudo_access, output[:5000]


          uid_min = get_uid_min()

          shadow_db = load_shadow()

          today_days = (
              datetime.date.today()
              - datetime.date(1970, 1, 1)
          ).days

          records = []

          for account in pwd.getpwall():

              username = account.pw_name

              uid = account.pw_uid

              gid = account.pw_gid

              # -------------------------------------------------
              # Filter system accounts
              # -------------------------------------------------

              if not INCLUDE_SYSTEM:

                  if username != "root" and uid < uid_min:
                      continue

                  if uid == 65534:
                      continue

              shadow = shadow_db.get(username)

              password_hash = ""

              last_changed = ""

              min_age = ""

              max_age = ""

              warning_days = ""

              inactive_days = ""

              account_expire = ""

              if shadow:

                  password_hash = shadow[1]

                  last_changed = shadow[2]

                  min_age = shadow[3]

                  max_age = shadow[4]

                  warning_days = shadow[5]

                  inactive_days = shadow[6]

                  account_expire = shadow[7]

              # -------------------------------------------------
              # Password status
              # -------------------------------------------------

              if password_hash == "":

                  password_status = "NO-PASSWORD"

              elif password_hash.startswith("!"):

                  password_status = "LOCKED"

              elif password_hash.startswith("*"):

                  password_status = "LOCKED"

              else:

                  password_status = "SET"

              # -------------------------------------------------
              # Password last changed
              # -------------------------------------------------

              password_last_changed = shadow_day_to_date(
                  last_changed
              )

              # -------------------------------------------------
              # Password expiration
              # -------------------------------------------------

              password_expires = "Never"

              try:

                  last_change_value = int(last_changed)

                  maximum_age_value = int(max_age)

                  if (
                      last_change_value > 0
                      and maximum_age_value > 0
                      and maximum_age_value < 99999
                  ):

                      expiry_day = (
                          last_change_value
                          + maximum_age_value
                      )

                      password_expires = shadow_day_to_date(
                          expiry_day
                      )

              except Exception:
                  pass

              # -------------------------------------------------
              # Account expiration
              # -------------------------------------------------

              if account_expire:

                  account_expires = shadow_day_to_date(
                      account_expire
                  )

              else:

                  account_expires = "Never"

              # -------------------------------------------------
              # Account status
              # -------------------------------------------------

              account_status = "ENABLED"

              try:

                  if (
                      account_expire
                      and int(account_expire) > 0
                      and int(account_expire) <= today_days
                  ):

                      account_status = "EXPIRED"

                  elif account.pw_shell in [
                      "/sbin/nologin",
                      "/usr/sbin/nologin",
                      "/bin/false"
                  ]:

                      account_status = "DISABLED-SHELL"

                  elif password_hash.startswith(("!", "*")):

                      account_status = "PASSWORD-LOCKED"

              except Exception:
                  pass

              # -------------------------------------------------
              # Groups
              # -------------------------------------------------

              groups = get_groups(
                  username,
                  gid
              )

              # -------------------------------------------------
              # Sudo
              # -------------------------------------------------

              sudo_access, sudo_privileges = get_sudo(
                  username
              )

              # -------------------------------------------------
              # Creation date
              # -------------------------------------------------

              creation_date = get_creation_date(
                  account.pw_dir
              )

              records.append(
                  {
                      "server": INVENTORY_HOST,
                      "server_ip": SERVER_IP,
                      "username": username,
                      "uid": uid,
                      "gid": gid,
                      "full_name": account.pw_gecos,
                      "account_status": account_status,
                      "password_status": password_status,
                      "password_last_changed": password_last_changed,
                      "password_expires": password_expires,
                      "password_min_days": min_age,
                      "password_max_days": max_age,
                      "password_warning_days": warning_days,
                      "password_inactive_days": inactive_days,
                      "account_expires": account_expires,
                      "creation_date_estimate": creation_date,
                      "groups": groups,
                      "sudo_access": sudo_access,
                      "sudo_privileges": sudo_privileges,
                      "home_directory": account.pw_dir,
                      "login_shell": account.pw_shell
                  }
              )

          os.makedirs(
              REPORT_DIR,
              exist_ok=True
          )

          report_file = os.path.join(
              REPORT_DIR,
              INVENTORY_HOST + "-user-compliance.csv"
          )

          fields = [
              "server",
              "server_ip",
              "username",
              "uid",
              "gid",
              "full_name",
              "account_status",
              "password_status",
              "password_last_changed",
              "password_expires",
              "password_min_days",
              "password_max_days",
              "password_warning_days",
              "password_inactive_days",
              "account_expires",
              "creation_date_estimate",
              "groups",
              "sudo_access",
              "sudo_privileges",
              "home_directory",
              "login_shell"
          ]

          with open(
              report_file,
              "w",
              newline=""
          ) as csv_file:

              writer = csv.DictWriter(
                  csv_file,
                  fieldnames=fields,
                  quoting=csv.QUOTE_ALL
              )

              writer.writeheader()

              writer.writerows(records)

          print(
              "REPORT_FILE=" + report_file
          )

          print(
              "ACCOUNTS_CHECKED=" + str(len(records))
          )


    - name: Run Linux account compliance collector
      ansible.builtin.command:
        cmd: /usr/bin/python3 /tmp/linux_user_compliance.py
      register: compliance_result
      changed_when: false


    - name: Display compliance report information
      ansible.builtin.debug:
        msg:
          - "Server: {{ inventory_hostname }}"
          - "IP: {{ ansible_host | default(inventory_hostname) }}"
          - "{{ compliance_result.stdout }}"


    - name: Check generated CSV report
      ansible.builtin.stat:
        path: "{{ report_dir }}/{{ inventory_hostname }}-user-compliance.csv"
      register: report_status


    - name: Show generated CSV file
      ansible.builtin.debug:
        msg: >-
          CSV report created:
          {{ report_dir }}/{{ inventory_hostname }}-user-compliance.csv
          Size={{ report_status.stat.size | default(0) }} bytes


    - name: Fetch CSV report from managed server to AWX job
      ansible.builtin.fetch:
        src: "{{ report_dir }}/{{ inventory_hostname }}-user-compliance.csv"
        dest: "/tmp/linux-user-compliance/{{ inventory_hostname }}-user-compliance.csv"
        flat: true


    - name: Remove temporary Python collector
      ansible.builtin.file:
        path: /tmp/linux_user_compliance.py
        state: absent


# =====================================================================
# Consolidate all server CSV reports into a single CSV on AWX
# =====================================================================

- name: Build consolidated Linux user compliance report
  hosts: localhost
  gather_facts: false

  vars:
    local_report_dir: /tmp/linux-user-compliance

  tasks:

    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: "0755"


    - name: Find individual compliance CSV files
      ansible.builtin.find:
        paths: "{{ local_report_dir }}"
        patterns: "*-user-compliance.csv"
        file_type: file
      register: compliance_files


    - name: Display number of reports received
      ansible.builtin.debug:
        msg: >-
          Received {{ compliance_files.files | length }}
          Linux server compliance report(s).


    - name: Create consolidated CSV report
      ansible.builtin.shell: |
        set -o pipefail

        OUTPUT="{{ local_report_dir }}/all-linux-user-compliance.csv"

        rm -f "$OUTPUT"

        FIRST=1

        for FILE in {{ local_report_dir }}/*-user-compliance.csv
        do

            if [ ! -f "$FILE" ]; then
                continue
            fi

            if [ "$FIRST" -eq 1 ]; then

                cat "$FILE" > "$OUTPUT"

                FIRST=0

            else

                tail -n +2 "$FILE" >> "$OUTPUT"

            fi

        done
      args:
        executable: /bin/bash
      changed_when: true


    - name: Check consolidated report
      ansible.builtin.stat:
        path: "{{ local_report_dir }}/all-linux-user-compliance.csv"
      register: consolidated_report


    - name: Count consolidated compliance records
      ansible.builtin.shell: |
        if [ -f "{{ local_report_dir }}/all-linux-user-compliance.csv" ]; then
            LINES=$(wc -l < "{{ local_report_dir }}/all-linux-user-compliance.csv")
            if [ "$LINES" -gt 0 ]; then
                echo $((LINES - 1))
            else
                echo 0
            fi
        else
            echo 0
        fi
      args:
        executable: /bin/bash
      register: consolidated_count
      changed_when: false


    - name: Display consolidated report summary
      ansible.builtin.debug:
        msg:
          - "Consolidated Report: {{ local_report_dir }}/all-linux-user-compliance.csv"
          - "Report Size: {{ consolidated_report.stat.size | default(0) }} bytes"
          - "Total User Records: {{ consolidated_count.stdout }}"
          - "Servers Processed: {{ compliance_files.files | length }}"


    - name: Show first 20 lines of consolidated report
      ansible.builtin.command:
        cmd: >-
          head -20
          {{ local_report_dir }}/all-linux-user-compliance.csv
      register: report_preview
      changed_when: false


    - name: Display report preview in AWX
      ansible.builtin.debug:
        var: report_preview.stdout_lines