  hosts: linux
  become: true
  gather_facts: true

  tasks:
    # Your compliance collection tasks here


###############################################################################
# PLAY 2 - AWX execution environment
###############################################################################

- name: Generate central Linux user compliance CSV
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    ansible_become: false
    central_report_dir: /tmp/linux-user-compliance
    central_report_file: /tmp/linux-user-compliance/all-linux-user-compliance.csv

  tasks:

    - name: Create central compliance directory
      ansible.builtin.file:
        path: "{{ central_report_dir }}"
        state: directory
        mode: "0755"

    - name: Generate consolidated CSV report
      ansible.builtin.copy:
        dest: "{{ central_report_file }}"
        mode: "0644"
        content: |
          "Server","Server IP","Username","UID","GID","Full Name","Account Status","Password Status","Password Last Changed","Password Expires","Password Minimum Days","Password Maximum Days","Password Warning Days","Password Inactive Days","Account Expires","User Creation Date Estimate","Groups","Sudo Access","Sudo Privileges","Home Directory","Login Shell"
          {% for host in groups['linux'] | default([]) %}
          {% for user in hostvars[host].compliance_accounts | default([]) %}
          "{{ host | replace('"','""') }}","{{ hostvars[host].ansible_host | default(host) }}","{{ user.username | replace('"','""') }}","{{ user.uid }}","{{ user.gid }}","{{ user.full_name | replace('"','""') }}","{{ user.account_status }}","{{ user.password_status }}","{{ user.password_last_changed }}","{{ user.password_expires }}","{{ user.password_min_days }}","{{ user.password_max_days }}","{{ user.password_warning_days }}","{{ user.password_inactive_days }}","{{ user.account_expires }}","{{ user.creation_date_estimate | replace('"','""') }}","{{ user.groups | replace('"','""') }}","{{ user.sudo_access }}","{{ user.sudo_privileges | replace('"','""') }}","{{ user.home_directory | replace('"','""') }}","{{ user.login_shell | replace('"','""') }}"
          {% endfor %}
          {% endfor %}

    - name: Check central CSV report
      ansible.builtin.stat:
        path: "{{ central_report_file }}"
      register: report_status

    - name: Count compliance records
      ansible.builtin.shell: |
        TOTAL_LINES=$(wc -l < "{{ central_report_file }}")

        if [ "$TOTAL_LINES" -gt 0 ]; then
            echo $((TOTAL_LINES - 1))
        else
            echo 0
        fi
      args:
        executable: /bin/bash
      register: compliance_count
      changed_when: false

    - name: Display report summary
      ansible.builtin.debug:
        msg:
          - "Central CSV: {{ central_report_file }}"
          - "File size: {{ report_status.stat.size | default(0) }} bytes"
          - "Linux servers: {{ groups['linux'] | default([]) | length }}"
          - "User records: {{ compliance_count.stdout }}"

    - name: Preview report
      ansible.builtin.command:
        cmd: "head -20 {{ central_report_file }}"
      register: report_preview
      changed_when: false

    - name: Display report preview
      ansible.builtin.debug:
        var: report_preview.stdout_lines