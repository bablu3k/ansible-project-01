---
- name: Install Prometheus Node Exporter on Linux servers
  hosts: linux
  become: true
  gather_facts: true

  vars:
    node_exporter_source: /opt/awx-packages/node_exporter-linux-amd64.tar.gz
    node_exporter_remote_archive: /tmp/node_exporter-linux-amd64.tar.gz
    node_exporter_extract_dir: /tmp/node_exporter_install

  tasks:

    - name: Create Node Exporter account
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false
        state: present

    - name: Copy Node Exporter from AWX local repository
      ansible.builtin.copy:
        src: "{{ node_exporter_source }}"
        dest: "{{ node_exporter_remote_archive }}"
        mode: "0644"

    - name: Remove old extraction directory
      ansible.builtin.file:
        path: "{{ node_exporter_extract_dir }}"
        state: absent

    - name: Create extraction directory
      ansible.builtin.file:
        path: "{{ node_exporter_extract_dir }}"
        state: directory
        mode: "0755"

    - name: Extract Node Exporter
      ansible.builtin.unarchive:
        src: "{{ node_exporter_remote_archive }}"
        dest: "{{ node_exporter_extract_dir }}"
        remote_src: true

    - name: Find Node Exporter binary
      ansible.builtin.find:
        paths: "{{ node_exporter_extract_dir }}"
        patterns: node_exporter
        file_type: file
        recurse: true
      register: node_exporter_binary

    - name: Fail if Node Exporter binary was not found
      ansible.builtin.fail:
        msg: "node_exporter binary was not found."
      when: node_exporter_binary.matched == 0

    - name: Install Node Exporter binary
      ansible.builtin.copy:
        src: "{{ node_exporter_binary.files[0].path }}"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Create Node Exporter service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: restarted

    - name: Check firewalld
      ansible.builtin.command:
        cmd: systemctl is-active firewalld
      register: firewalld_status
      failed_when: false
      changed_when: false

    - name: Open TCP 9100
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port=9100/tcp
      when: firewalld_status.rc == 0
      changed_when: false

    - name: Reload firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when: firewalld_status.rc == 0
      changed_when: false

    - name: Verify Node Exporter
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        status_code: 200
      register: exporter_test
      retries: 5
      delay: 2
      until: exporter_test.status == 200

    - name: Display result
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "IP: {{ ansible_host }}"
          - "Node Exporter: Running"
          - "URL: http://{{ ansible_host }}:9100/metrics"

    - name: Clean temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ node_exporter_remote_archive }}"
        - "{{ node_exporter_extract_dir }}"
