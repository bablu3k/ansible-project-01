---
- name: Install Prometheus Node Exporter from central NFS repository
  hosts: linux
  become: true
  gather_facts: true

  vars:
    nfs_server: "192.168.20.204"
    nfs_export: "/mnt/k8s-nfs-share"
    nfs_mount: "/mnt/awx-software"

    node_exporter_archive: >-
      {{ nfs_mount }}/awx-software/node_exporter-linux-amd64.tar.gz

    node_exporter_extract_dir: "/tmp/node_exporter_install"

  tasks:

    ###########################################################################
    # NFS client
    ###########################################################################

    - name: Install NFS client package
      ansible.builtin.dnf:
        name: nfs-utils
        state: present

    ###########################################################################
    # Create NFS mount point
    ###########################################################################

    - name: Create software repository mount directory
      ansible.builtin.file:
        path: "{{ nfs_mount }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    ###########################################################################
    # Mount central software repository
    ###########################################################################

    - name: Mount central AWX software repository
      ansible.posix.mount:
        path: "{{ nfs_mount }}"
        src: "{{ nfs_server }}:{{ nfs_export }}"
        fstype: nfs
        opts: ro
        state: mounted

    ###########################################################################
    # Verify package
    ###########################################################################

    - name: Check Node Exporter archive
      ansible.builtin.stat:
        path: "{{ node_exporter_archive }}"
      register: node_exporter_package

    - name: Fail when Node Exporter package is missing
      ansible.builtin.fail:
        msg: >-
          Node Exporter package was not found:
          {{ node_exporter_archive }}
      when: not node_exporter_package.stat.exists

    - name: Display package information
      ansible.builtin.debug:
        msg:
          - "Server: {{ inventory_hostname }}"
          - "Package: {{ node_exporter_archive }}"
          - "Package size: {{ node_exporter_package.stat.size | default(0) }} bytes"

    ###########################################################################
    # Create node_exporter account
    ###########################################################################

    - name: Create Node Exporter account
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false
        state: present

    ###########################################################################
    # Prepare temporary extraction directory
    ###########################################################################

    - name: Remove previous extraction directory
      ansible.builtin.file:
        path: "{{ node_exporter_extract_dir }}"
        state: absent

    - name: Create extraction directory
      ansible.builtin.file:
        path: "{{ node_exporter_extract_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    ###########################################################################
    # Extract directly from NFS
    ###########################################################################

    - name: Extract Node Exporter directly from NFS
      ansible.builtin.unarchive:
        src: "{{ node_exporter_archive }}"
        dest: "{{ node_exporter_extract_dir }}"
        remote_src: true

    ###########################################################################
    # Locate executable
    ###########################################################################

    - name: Find Node Exporter binary
      ansible.builtin.find:
        paths: "{{ node_exporter_extract_dir }}"
        patterns: node_exporter
        file_type: file
        recurse: true
      register: node_exporter_binary

    - name: Fail when Node Exporter binary cannot be found
      ansible.builtin.fail:
        msg: "node_exporter binary was not found after extraction."
      when: node_exporter_binary.matched | int == 0

    ###########################################################################
    # Install executable
    ###########################################################################

    - name: Install Node Exporter binary
      ansible.builtin.copy:
        src: "{{ node_exporter_binary.files[0].path }}"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    ###########################################################################
    # Verify executable
    ###########################################################################

    - name: Check Node Exporter version
      ansible.builtin.command:
        cmd: /usr/local/bin/node_exporter --version
      register: node_exporter_version
      changed_when: false

    - name: Display Node Exporter version
      ansible.builtin.debug:
        var: node_exporter_version.stdout_lines

    ###########################################################################
    # systemd
    ###########################################################################

    - name: Create Node Exporter systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://prometheus.io/docs/guides/node-exporter/
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple

          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=0.0.0.0:9100

          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and restart Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: restarted

    ###########################################################################
    # Firewall
    ###########################################################################

    - name: Check firewalld service
      ansible.builtin.command:
        cmd: systemctl is-active firewalld
      register: firewalld_status
      changed_when: false
      failed_when: false

    - name: Open Node Exporter TCP port 9100
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port=9100/tcp
      register: firewall_9100
      changed_when: "'success' in firewall_9100.stdout"
      when: firewalld_status.rc == 0

    - name: Reload firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      changed_when: false
      when: firewalld_status.rc == 0

    ###########################################################################
    # Verify service
    ###########################################################################

    - name: Wait for Node Exporter
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        method: GET
        status_code: 200
      register: node_exporter_health
      retries: 10
      delay: 2
      until: node_exporter_health.status == 200

    - name: Check Node Exporter systemd status
      ansible.builtin.command:
        cmd: systemctl is-active node_exporter
      register: node_exporter_service
      changed_when: false

    ###########################################################################
    # Results
    ###########################################################################

    - name: Display installation result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Server: {{ inventory_hostname }}"
          - "IP: {{ ansible_host | default(inventory_hostname) }}"
          - "Node Exporter service: {{ node_exporter_service.stdout }}"
          - "Metrics URL: http://{{ ansible_host | default(inventory_hostname) }}:9100/metrics"
          - "Source repository: {{ nfs_server }}:{{ nfs_export }}"
          - "=============================================="

    ###########################################################################
    # Cleanup temporary extraction directory
    ###########################################################################

    - name: Remove temporary extraction directory
      ansible.builtin.file:
        path: "{{ node_exporter_extract_dir }}"
        state: absent
