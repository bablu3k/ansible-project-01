---
- name: Create devops Linux user
  hosts: linux
  become: true
  gather_facts: false

  tasks:

    - name: Create devops user
      ansible.builtin.user:
        name: devops
        comment: "DevOps User"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Verify devops user
      ansible.builtin.command:
        cmd: id devops
      register: devops_user
      changed_when: false

    - name: Display devops account information
      ansible.builtin.debug:
        var: devops_user.stdout