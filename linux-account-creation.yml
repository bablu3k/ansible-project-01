---
- name: Create devops Linux user
  hosts: linux01
  become: true
  gather_facts: false

  tasks:

    - name: Create devops user
      ansible.builtin.user:
        name: devops
        comment: "DevOps User"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Give devops sudo access
      ansible.builtin.copy:
        dest: /etc/sudoers.d/devops
        content: "devops ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"

    - name: Verify devops user
      ansible.builtin.command:
        cmd: id devops
      register: devops_user
      changed_when: false

    - name: Display devops account information
      ansible.builtin.debug:
        var: devops_user.stdout